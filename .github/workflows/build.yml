name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Turns on Crashlytics and Analytics in the build when the secret is set; builds without it otherwise.
      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase config added"
          else
            echo "No GOOGLE_SERVICES_JSON secret: building with telemetry off"
          fi

      - name: Imaging unit tests (JVM)
        run: gradle :core:imaging:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      # Run the image pipeline on a real Android graphics stack before publishing anything.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pipeline tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle :core:imaging:connectedDebugAndroidTest --stacktrace

      - name: Report test counts
        run: |
          # Result file names contain spaces (device names), so never word-split them.
          res=$(find . -path '*build/outputs/androidTest-results/connected*' -name '*.xml' -exec cat {} +)
          if [ -z "$res" ]; then echo "::error::No emulator test results found"; exit 1; fi
          t=$(printf '%s' "$res" | grep -o '<testcase' | wc -l)
          fl=$(printf '%s' "$res" | grep -o '<failure' | wc -l)
          u=$(find core -path '*build/test-results/testDebugUnitTest*' -name '*.xml' -exec cat {} + | grep -c '<testcase')
          echo "::notice title=Tests::emulator $t tests, $fl failures; JVM ${u:-0} tests"
          [ "$t" -gt 0 ] && [ "$fl" -eq 0 ]

      - uses: actions/upload-artifact@v4
        with:
          name: productsnap-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Each branch gets its own pre-release with an installable APK.
      - name: Publish branch build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --yes --cleanup-tag || true
          cp app/build/outputs/apk/debug/app-debug.apk "productsnap-${GITHUB_SHA::7}.apk"
          gh release create "$tag" "productsnap-${GITHUB_SHA::7}.apk" --target "$GITHUB_SHA" \
            --title "Build: $GITHUB_REF_NAME" \
            --notes "Debug build of ${GITHUB_SHA::7}. Uninstall any other ProductSnap build first (different signing key)." \
            --prerelease
