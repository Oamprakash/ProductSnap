name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Turns on Crashlytics and Analytics in the build when the secret is set; builds without it otherwise.
      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase config added"
          else
            echo "No GOOGLE_SERVICES_JSON secret: building with telemetry off"
          fi

      - name: Imaging unit tests (JVM)
        run: gradle :core:imaging:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      # Run the image pipeline on a real Android graphics stack before publishing anything.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pipeline tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle :core:imaging:connectedDebugAndroidTest --stacktrace

      - name: Report test counts
        run: |
          # Result file names contain spaces (device names), so never word-split them.
          res=$(find . -path '*build/outputs/androidTest-results/connected*' -name '*.xml' -exec cat {} +)
          if [ -z "$res" ]; then echo "::error::No emulator test results found"; exit 1; fi
          t=$(printf '%s' "$res" | grep -o '<testcase' | wc -l)
          fl=$(printf '%s' "$res" | grep -o '<failure' | wc -l)
          u=$(find core -path '*build/test-results/testDebugUnitTest*' -name '*.xml' -exec cat {} + | grep -c '<testcase')
          echo "::notice title=Tests::emulator $t tests, $fl failures; JVM ${u:-0} tests"
          [ "$t" -gt 0 ] && [ "$fl" -eq 0 ]

      - uses: actions/upload-artifact@v4
        with:
          name: productsnap-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Each branch gets its own pre-release with an installable APK.
      # The release build shrinks code with R8, which can break on libraries (ML Kit, Firebase, Billing): check it
      # compiles on every push, unsigned, before it matters.
      - name: Release build compiles (R8)
        run: gradle :app:bundleRelease --stacktrace

      # Signed bundle for Play, built on main only when the upload key secrets are set.
      - name: Build signed release bundle
        id: bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.PRODUCTSNAP_KEYSTORE_BASE64 }}
          PRODUCTSNAP_KEYSTORE_PASSWORD: ${{ secrets.PRODUCTSNAP_KEYSTORE_PASSWORD }}
          PRODUCTSNAP_KEY_ALIAS: ${{ secrets.PRODUCTSNAP_KEY_ALIAS }}
          PRODUCTSNAP_KEY_PASSWORD: ${{ secrets.PRODUCTSNAP_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No upload key secrets: skipping the release bundle"
            exit 0
          fi
          export PRODUCTSNAP_KEYSTORE="$RUNNER_TEMP/upload.jks"
          # Tolerate line breaks or Windows line endings pasted into the secret.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$PRODUCTSNAP_KEYSTORE" 2>/dev/null; then
            echo "::error title=Signing key::PRODUCTSNAP_KEYSTORE_BASE64 isn't valid base64. Re-copy the whole output of the PowerShell command."
            exit 1
          fi
          echo "::notice title=Signing key::Keystore decoded, $(wc -c < "$PRODUCTSNAP_KEYSTORE") bytes"
          # Check passwords and alias with keytool first, so a mistake names itself (secret values never printed).
          for v in PRODUCTSNAP_KEYSTORE_PASSWORD PRODUCTSNAP_KEY_ALIAS PRODUCTSNAP_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error title=Signing key::Secret $v is empty or missing."; exit 1; fi
          done
          if ! keytool -list -keystore "$PRODUCTSNAP_KEYSTORE" -storepass "$PRODUCTSNAP_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/ks.txt" 2>&1; then
            echo "::error title=Signing key::keytool can't open the keystore: $(grep -m1 -i 'error\|exception' "$RUNNER_TEMP/ks.txt" | sed 's/^.*: //'). Most likely PRODUCTSNAP_KEYSTORE_PASSWORD is wrong."
            exit 1
          fi
          aliases=$(grep -i 'PrivateKeyEntry' "$RUNNER_TEMP/ks.txt" | cut -d, -f1 | tr '\n' ' ')
          if ! keytool -list -keystore "$PRODUCTSNAP_KEYSTORE" -storepass "$PRODUCTSNAP_KEYSTORE_PASSWORD" -alias "$PRODUCTSNAP_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error title=Signing key::No key named by PRODUCTSNAP_KEY_ALIAS in the keystore. Keys it has: $aliases"
            exit 1
          fi
          echo "::notice title=Signing key::Keystore password and alias OK"
          # The .aab is for Play; the APK, signed with the same upload key, installs directly to test the release build.
          if ! gradle :app:bundleRelease :app:assembleRelease --stacktrace > "$RUNNER_TEMP/bundle.log" 2>&1; then
            reason=$(grep -m3 -iE 'Cannot recover key|password|keystore|alias|What went wrong' -A2 "$RUNNER_TEMP/bundle.log" | grep -v '^--$' | tr '\n' ' ' | cut -c1-400)
            echo "::error title=Release bundle::$reason"
            tail -n 60 "$RUNNER_TEMP/bundle.log"
            rm -f "$PRODUCTSNAP_KEYSTORE"
            exit 1
          fi
          rm -f "$PRODUCTSNAP_KEYSTORE"
          cp app/build/outputs/bundle/release/app-release.aab "productsnap-${GITHUB_SHA::7}-release.aab"
          cp app/build/outputs/apk/release/app-release.apk "productsnap-${GITHUB_SHA::7}-release.apk"
          echo "aab=productsnap-${GITHUB_SHA::7}-release.aab" >> "$GITHUB_OUTPUT"
          echo "apk=productsnap-${GITHUB_SHA::7}-release.apk" >> "$GITHUB_OUTPUT"

      - name: Publish release bundle
        if: steps.bundle.outputs.aab != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete play-upload --yes --cleanup-tag || true
          gh release create play-upload "${{ steps.bundle.outputs.aab }}" "${{ steps.bundle.outputs.apk }}" --target "$GITHUB_SHA" --prerelease \
            --title "Play upload: ${GITHUB_SHA::7} (version code ${GITHUB_RUN_NUMBER})" \
            --notes "Signed with the upload key. Upload the .aab to Play Console > Internal testing. The release .apk installs directly to test the release build (uninstall debug builds first; uninstall it again before installing from Play)."

      - name: Publish branch build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --yes --cleanup-tag || true
          cp app/build/outputs/apk/debug/app-debug.apk "productsnap-${GITHUB_SHA::7}.apk"
          gh release create "$tag" "productsnap-${GITHUB_SHA::7}.apk" --target "$GITHUB_SHA" \
            --title "Build: $GITHUB_REF_NAME" \
            --notes "Debug build of ${GITHUB_SHA::7}. Uninstall any other ProductSnap build first (different signing key)." \
            --prerelease
